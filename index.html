<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Painted Worlds — The Starry Night</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
      body { font: 16px/1.5 ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; color: #eef0f6; }
      canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #veil {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 32px 16px;
        background: radial-gradient(120% 90% at 50% 40%, rgba(8, 12, 28, 0.35), rgba(8, 12, 28, 0.86));
        transition: opacity 0.9s ease; text-align: center;
      }
      #veil.gone { opacity: 0; pointer-events: none; }
      .card { max-width: 34rem; }
      .kicker { font: 500 0.78rem/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.32em; text-transform: uppercase; color: #b9c3e6; }
      h1 { font-weight: 400; font-size: clamp(2.4rem, 7vw, 4.2rem); line-height: 1.05; margin: 1.1rem 0 0.6rem; letter-spacing: -0.01em; }
      .sub { color: #c5cbe0; font-style: italic; margin: 0 0 2.2rem; }
      button {
        font: 500 1rem/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.04em; color: #0b1020;
        background: #f1e6a0; border: 0; border-radius: 999px; padding: 1rem 2.4rem; cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      button:hover { background: #f8efba; transform: translateY(-1px); }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
      button.quiet { background: transparent; color: #d7dcf0; box-shadow: inset 0 0 0 1px rgba(215, 220, 240, 0.45); margin-left: 0.6rem; }
      button[hidden] { display: none; }
      .note { font: 400 0.86rem/1.6 ui-sans-serif, system-ui, sans-serif; color: #9ea8cb; margin-top: 2rem; min-height: 2.8em; }
      details { font: 400 0.86rem/1.55 ui-sans-serif, system-ui, sans-serif; color: #b9c3e6; text-align: left; margin: 0.4rem auto 0; max-width: 30rem; }
      summary { cursor: pointer; text-align: center; color: #d7dcf0; letter-spacing: 0.04em; padding: 0.5rem; }
      details ol { margin: 0.6rem 0 0; padding-left: 1.4rem; max-height: 38vh; overflow: auto; }
      details li { margin-bottom: 0.45rem; }
      details b { color: #eef0f6; font-weight: 600; }
      .build { position: fixed; left: 0; right: 0; bottom: 14px; font: 400 0.72rem/1 ui-monospace, monospace; color: #6f7aa3; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="veil">
      <div class="card">
        <div class="kicker">Painted Worlds</div>
        <h1>The Starry Night</h1>
        <p class="sub">Study 26 · the rest of the houses</p>
        <button id="enter" hidden>Step inside</button>
        <button id="look" class="quiet" hidden>Look around here</button>
        <p class="note" id="note">Preparing the paint…</p>
        <details>
          <summary>What to test</summary>
          <ol id="tests"></ol>
        </details>
      </div>
      <div class="build" id="build"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
